name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_GROUND_002154300 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./hiltend-frontend"
          api_location: ""
          output_location: "dist"
        env:
          VITE_AZURE_TENANT_ID: ${{ vars.VITE_AZURE_TENANT_ID_GH }}
          VITE_AZURE_CLIENT_ID: ${{ vars.VITE_AZURE_CLIENT_ID_GH }}
          VITE_BACKEND_CLIENT_ID: ${{ vars.VITE_BACKEND_CLIENT_ID_GH }}
          VITE_API_BASE_URL: "https://hiltend-container-backend.wonderfulcliff-03d5f7bc.southindia.azurecontainerapps.io"
          # VITE_FRONTEND_URL is the ASWA origin — used as the MSAL redirectUri.
          # Add VITE_FRONTEND_URL_GH as a GitHub Variable pointing to your ASWA URL.
          # e.g. https://ashy-ground-002154300.azurestaticapps.net
          VITE_FRONTEND_URL: ${{ vars.VITE_FRONTEND_URL_GH }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_GROUND_002154300 }}
          action: "close"
